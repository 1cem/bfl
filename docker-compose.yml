version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bfl
      POSTGRES_PASSWORD: bfl_secret
      POSTGRES_DB: bfl_gtm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfl -d bfl_gtm"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://bfl:bfl_secret@db:5432/bfl_gtm?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss &&
             npx ts-node --compiler-options '{\"module\":\"CommonJS\"}' prisma/seed.ts &&
             node server.js"

volumes:
  pgdata:
